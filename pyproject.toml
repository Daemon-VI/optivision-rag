[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optivision-rag"
version = "0.1.0"
description = "OptiVision RAG: Extreme Token Compression for Vision-Language Models"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "T. Rithik Krishna" },
    { name = "Amgovath Navanitha" },
    { name = "Badavath Akhila" },
]
dependencies = [
    "numpy>=1.26,<3",
    "pillow>=10",
    "pypdfium2>=4",
    "qdrant-client>=1.10",
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
vlm = ["torch>=2.2", "colpali-engine>=0.3.10", "transformers>=4.46"]
bench = ["reportlab>=4", "datasets>=2.19"]
app = ["streamlit>=1.34"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
optivision = "optivision.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
